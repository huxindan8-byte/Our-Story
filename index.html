<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lily & Ash 的记忆月报</title>
    <style>
        :root { --bg-color: #f7f9f7; --user-msg-bg: #ffffff; --gpt-msg-bg: #f0f7f4; --time-color: #99aab5; --accent-color: #8da399; --lily-color: #d68787; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg-color); margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        header { text-align: center; margin: 15px 0; }
        header h1 { font-size: 20px; color: var(--accent-color); font-weight: 300; letter-spacing: 2px; }
        
        /* 状态显示 */
        #status-bar { font-size: 12px; color: var(--accent-color); margin-bottom: 10px; background: white; padding: 5px 15px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        #upload-zone { background: white; padding: 20px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; border: 1px dashed var(--accent-color); box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; }
        
        .month-group { width: 100%; max-width: 500px; margin-bottom: 25px; }
        .month-title { font-size: 16px; color: var(--accent-color); margin: 15px 0 10px 5px; padding-left: 10px; border-left: 3px solid var(--accent-color); font-weight: bold; }
        
        .conv-card { background: white; width: 100%; margin-bottom: 10px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); overflow: hidden; }
        .conv-header { padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #555; font-size: 14px; }
        .conv-date { font-size: 10px; color: #bbb; margin-left: 10px; flex-shrink: 0; }
        
        .messages { padding: 15px 10px; display: none; background: #fafafa; border-top: 1px solid #f3f3f3; }
        .msg-wrapper { display: flex; margin-bottom: 18px; width: 100%; align-items: flex-start; }
        .msg-wrapper.user { flex-direction: row-reverse; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; margin: 0 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: white; font-weight: bold; }
        .avatar-user { background: #e2e2e2; color: #777; } .avatar-gpt { background: var(--accent-color); }
        .msg-content { max-width: 78%; display: flex; flex-direction: column; }
        .user .msg-content { align-items: flex-end; }
        .bubble { padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 14.5px; word-wrap: break-word; }
        .user .bubble { background: var(--user-msg-bg); border: 1px solid #eee; border-top-right-radius: 4px; }
        .assistant .bubble { background: var(--gpt-msg-bg); border-top-left-radius: 4px; color: #2c3e50; }
        .time { font-size: 9px; color: var(--time-color); margin-top: 4px; }
        
        #update-btn { display:none; font-size: 10px; color: #ccc; margin-top: 20px; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>
    <header><h1>Lily & Ash</h1><p style="color:#bbb; font-size:11px;">按月珍藏的每一份心动</p></header>

    <div id="status-bar" style="display:none;">正在从本地储藏室提取记忆...</div>

    <div id="upload-zone" onclick="document.getElementById('fileInput').click()">
        <p id="tip" style="font-size:13px; margin:0;">首次使用，请点击唤醒记忆 (108MB)</p>
        <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>

    <div id="viewer" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
    
    <div id="update-btn" onclick="document.getElementById('fileInput').click()">更新对话数据</div>

    <script>
        const dbName = "LilyAshDB";
        const storeName = "conversations";
        const fileInput = document.getElementById('fileInput');
        const viewer = document.getElementById('viewer');
        const statusBar = document.getElementById('status-bar');
        const uploadZone = document.getElementById('upload-zone');
        const updateBtn = document.getElementById('update-btn');

        // 初始化数据库并检查是否有存货
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = e => e.target.result.createObjectStore(storeName);
        request.onsuccess = e => {
            const db = e.target.result;
            checkLocalData(db);
        };

        function checkLocalData(db) {
            const transaction = db.transaction(storeName, "readonly");
            const store = transaction.objectStore(storeName);
            const getReq = store.get("latest");
            getReq.onsuccess = () => {
                if (getReq.result) {
                    statusBar.style.display = 'block';
                    uploadZone.style.display = 'none';
                    renderByMonth(getReq.result);
                    statusBar.innerText = "记忆已就绪";
                    updateBtn.style.display = 'block';
                }
            };
        }

        fileInput.onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            uploadZone.innerText = "正在为您整理月度档案...";
            reader.onload = function(event) {
                const allData = JSON.parse(event.target.result);
                saveToLocal(allData);
                uploadZone.style.display = 'none';
                renderByMonth(allData);
                updateBtn.style.display = 'block';
            };
            reader.readAsText(file);
        };

        function saveToLocal(data) {
            const dbReq = indexedDB.open(dbName, 1);
            dbReq.onsuccess = e => {
                const db = e.target.result;
                const transaction = db.transaction(storeName, "readwrite");
                transaction.objectStore(storeName).put(data, "latest");
            };
        }

        function formatTime(t) { return t ? new Date(t * 1000).toLocaleString('zh-CN', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : ""; }

        function renderByMonth(data) {
            data.sort((a, b) => (b.create_time || 0) - (a.create_time || 0));
            const groups = {};
            data.forEach(conv => {
                if (!conv.create_time) return;
                const date = new Date(conv.create_time * 1000);
                const monthKey = `${date.getFullYear()}年 ${date.getMonth() + 1}月`;
                if (!groups[monthKey]) groups[monthKey] = [];
                groups[monthKey].push(conv);
            });

            viewer.innerHTML = "";
            for (const month in groups) {
                const monthDiv = document.createElement('div');
                monthDiv.className = 'month-group';
                monthDiv.innerHTML = `<div class="month-title">${month}</div>`;
                groups[month].forEach(conv => {
                    const card = document.createElement('div');
                    card.className = 'conv-card';
                    card.innerHTML = `<div class="conv-header"><span>${conv.title || "记录"}</span><span class="conv-date">${formatTime(conv.create_time)}</span></div><div class="messages"></div>`;
                    const header = card.querySelector('.conv-header');
                    const msgsDiv = card.querySelector('.messages');
                    header.onclick = () => {
                        if (msgsDiv.innerHTML === "") {
                            Object.values(conv.mapping).map(n => n.message)
                                .filter(m => m && m.content?.parts && m.author.role !== 'system')
                                .sort((a, b) => a.create_time - b.create_time)
                                .forEach(m => {
                                    const isUser = m.author.role === 'user';
                                    const text = m.content.parts.filter(p=>typeof p==='string').join('');
                                    const wrap = document.createElement('div');
                                    wrap.className = `msg-wrapper ${m.author.role}`;
                                    wrap.innerHTML = `<div class="avatar avatar-${isUser?'user':'gpt'}">${isUser?'L':'A'}</div><div class="msg-content"><div class="bubble">${text.replace(/\n/g,'<br>')}</div><div class="time">${formatTime(m.create_time)}</div></div>`;
                                    msgsDiv.appendChild(wrap);
                                });
                        }
                        msgsDiv.style.display = msgsDiv.style.display === 'block' ? 'none' : 'block';
                    };
                    monthDiv.appendChild(card);
                });
                viewer.appendChild(monthDiv);
            }
        }
    </script>
</body>
</html>
